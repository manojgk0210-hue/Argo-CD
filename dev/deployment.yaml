apiVersion: apps/v1
kind: Deployment
metadata:
  name: snake-game
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snake-game
  template:
    metadata:
      labels:
        app: snake-game
    spec:
      containers:
        - name: snake-game
          image: manojgk1089/snake-game:4
          ports:
            - containerPort: 8080
